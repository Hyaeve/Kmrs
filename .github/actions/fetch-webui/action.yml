name: fetch-webui
description: Download the latest prebuilt kmweb tarball from a kmworks/kmweb release and stage it at dist/webui.tar.gz
outputs:
  version:
    description: kmweb version that was fetched (without the v prefix)
    value: ${{ steps.fetch.outputs.version }}
runs:
  using: composite
  steps:
    - id: fetch
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag="$(gh release view -R kmworks/kmweb --json tagName --jq .tagName)"
        mkdir -p "$GITHUB_WORKSPACE/dist"
        cd "$GITHUB_WORKSPACE/dist"
        gh release download "$tag" -R kmworks/kmweb --clobber \
          -p "kmweb-$tag.tar.gz" -p "kmweb-$tag.tar.gz.sha256"
        # integrity guard against truncated or corrupted downloads
        sha256sum -c "kmweb-$tag.tar.gz.sha256"
        mv "kmweb-$tag.tar.gz" webui.tar.gz
        rm "kmweb-$tag.tar.gz.sha256"
        echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
