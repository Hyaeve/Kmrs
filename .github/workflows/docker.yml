name: Docker

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "webui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/actions/build-webui/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-webui
      - uses: actions/upload-artifact@v7
        with:
          name: docker-webui-dist
          path: webui/dist

  build:
    needs: webui
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
    runs-on: ubuntu-latest
    env:
      LZMA_API_STATIC: "1"
      CARGO_PROFILE_RELEASE_STRIP: "debuginfo"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: docker-webui-dist
          path: webui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - run: cross build --release --target ${{ matrix.target }} -p komga-server --features profiling
      - name: Package
        shell: bash
        run: |
          stage="kmrs_${GITHUB_SHA}_${{ matrix.target }}"
          mkdir -p "$stage" dist
          cp "target/${{ matrix.target }}/release/kmrs" "$stage/"
          tar -czf "dist/${stage}.tar.gz" "$stage"
      - uses: actions/upload-artifact@v7
        with:
          name: docker-kmrs-${{ matrix.target }}
          path: dist/*.tar.gz

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: "docker-kmrs-*"
          path: artifacts
      - name: Stage binaries
        run: |
          mkdir -p dist/amd64 dist/arm64
          tar -xzf artifacts/docker-kmrs-x86_64-unknown-linux-gnu/*.tar.gz -C dist/amd64 --strip-components=1 --wildcards '*/kmrs'
          tar -xzf artifacts/docker-kmrs-aarch64-unknown-linux-gnu/*.tar.gz -C dist/arm64 --strip-components=1 --wildcards '*/kmrs'
          ls -l dist/amd64 dist/arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-
      - name: Smoke test (amd64)
        run: |
          trap 'docker logs kmrs' ERR
          docker buildx build --platform linux/amd64 --load -t kmrs:smoke .
          docker run -d --name kmrs --user 1000:1000 -p 25600:25600 kmrs:smoke
          for i in $(seq 1 30); do
            curl -sf http://localhost:25600/actuator/health > /dev/null && break || sleep 2
          done
          curl -sf http://localhost:25600/ | grep -q "<title>KMReader</title>"
          curl -sf http://localhost:25600/api/v1/claim | grep -q '"isClaimed":false'
          echo "server is up: web UI and API verified"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
