name: Release

# Publishes a GitHub release whenever the workspace version in Cargo.toml is
# bumped on master: the version job computes v<version>, skips if that release
# already exists, otherwise the matrix builds and the release job publishes.
# `gh release create` creates the tag itself, pointing at the triggering commit.
on:
  push:
    branches: [master]
    paths: [Cargo.toml, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(awk -F'"' '/^\[workspace\.package\]/{s=1} s && /^version = /{print $2; exit}' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "::notice::release v$version already exists, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install aarch64 cross compiler
        if: matrix.cross == true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - run: cargo build --release --target ${{ matrix.target }} -p komga-server
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          stage="kmrs_${{ needs.version.outputs.version }}_${{ matrix.target }}"
          mkdir -p "$stage" dist
          cp "target/${{ matrix.target }}/release/kmrs" "$stage/"
          cp LICENSE README.md "$stage/"
          tar -czf "dist/${stage}.tar.gz" "$stage"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "kmrs_${{ needs.version.outputs.version }}_${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stage, dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\kmrs.exe" $stage
          Copy-Item LICENSE, README.md $stage
          Compress-Archive -Path $stage -DestinationPath "dist\${stage}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [version, build]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - run: gh release create "$TAG" --title "$TAG" --generate-notes --target "$GITHUB_SHA" artifacts/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
