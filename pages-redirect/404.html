<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting…</title>
<meta name="robots" content="noindex">
</head>
<body>
<p>This page moved to <a id="dest" href="https://kmworks.date/server/">kmworks.date/server</a>.</p>
<script>
  var rest = location.pathname.replace(/^\/kmrs\/?/, '').replace(/^docs\/?/, '');
  var target = 'https://kmworks.date/server/' + rest;
  document.getElementById('dest').href = target;
  location.replace(target);
</script>
</body>
</html>
